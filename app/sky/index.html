:0}#view3d{position:fixed;inset:0;z-index:35;background:#000}.view3d-canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}.v3-bar{position:absolute;left:0;right:0;top:calc(var(--top) + 4px);display:flex;align-items:center;gap:12px;padding:0 8px}.v3-bar span{flex:1;text-align:center;font-size:18px;font-weight:700;text-shadow:0 1px 3px #000}.v3-bar button{width:44px;height:44px;display:grid;place-items:center;color:#fff;border-radius:50%;background:#2a2c30b3}#view3d-light[aria-pressed=true]{color:#ffd65a}#view3d-status{position:absolute;left:0;right:0;top:50%;text-align:center}.v3-hint{position:absolute;left:0;right:0;bottom:calc(var(--bottom) + 16px);text-align:center}#view3d-labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}.v3-label{position:absolute;left:0;top:0;font-size:12px;color:#ffffffd9;margin:-18px 0 0 6px;text-shadow:0 1px 2px #000;white-space:nowrap}.card-tools{display:flex;gap:8px;padding:10px 14px 2px;overflow-x:auto}.card-tools:empty{display:none}.tool{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:18px;background:var(--panel-2);font-size:13px;white-space:nowrap;flex:none}.tool svg.i{width:18px;height:18px;color:var(--accent)}.fav svg.i{width:26px;height:26px}.fav[aria-pressed=true]{color:#ffd65a}.card-graph{padding:10px 14px 0;touch-action:none}.card-graph svg{display:block;width:100%;height:auto}.card-graph .curve{fill:none;stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke}.card-graph .hz{stroke:#ffffff73;stroke-width:1}.card-graph .g{stroke:#ffffff1f;stroke-width:1}.card-graph .now{stroke:#ffd65a;stroke-width:1.5}.card-graph .best{fill:#ffd65a}.card-graph text{fill:var(--muted);font-size:9px;font-family:inherit}.card-graph text.gl{font-size:8px}</style>
  </head>
  <body>
    <canvas id="stel-canvas"></canvas>
    <div id="loading"><div class="spinner"></div></div>

    <!-- Corner controls: faint icons straight on the sky, like Stellarium Mobile. -->
    <button id="menu-btn" class="sky-icon tl" aria-label="Menu"></button>
    <button id="search-btn" class="sky-icon tr" aria-label="Search"></button>

    <!-- Pointing mode: big ring, altitude readout, triangle towards the target. -->
    <div id="pointer" hidden>
      <div class="ring"><span id="pointer-alt"></span></div>
      <svg id="pointer-tri" viewBox="0 0 100 100" aria-hidden="true"><path d="M8 18 L92 50 L8 82 Q22 50 8 18Z" /></svg>
    </div>

    <!-- Instrument field of view (eyepiece mask, camera frame, Telrad rings). -->
    <div id="ocular" hidden>
      <svg id="ocular-svg" aria-hidden="true"></svg>
      <div class="ocular-bar"><div><div id="ocular-name"></div><div id="ocular-facts" class="caption"></div></div><button id="ocular-close" aria-label="Hide field of view"></button></div>
    </div>
    <!-- Where the connected telescope points. -->
    <div id="scope-marker" hidden><svg viewBox="-20 -20 40 40"><circle r="12"/><path d="M-19 0h-0M0-19v0M-18 0h-8M18 0h8M0-18v-8M0 18v8" /></svg></div>

    <div id="dock">
      <div class="dock-row">
        <button id="layers-btn" class="sky-icon big" aria-label="Layers"></button>
        <button id="sensor-btn" class="sky-icon sensor" aria-label="Point at the sky" aria-pressed="false"></button>
        <button id="time-btn" class="time-btn" aria-label="Date and time">
          <span id="now-badge" class="now-badge" hidden></span>
          <span id="time-label">--:--</span>
        </button>
      </div>

      <!-- Selected object card -->
      <section id="card" class="sheet card" hidden>
        <div class="handle"></div>
        <div class="card-row">
          <div id="card-icon" class="obj-icon"></div>
          <div class="card-titles">
            <div id="card-name" class="card-name"></div>
            <div id="card-type" class="card-type"></div>
          </div>
          <button id="fav-btn" class="round-act fav" aria-label="Favourite" aria-pressed="false"></button>
          <div class="card-actions">
            <button id="zoom-out" class="round-act" aria-label="Zoom out" hidden></button>
            <button id="zoom-in" class="round-act" aria-label="Zoom in" hidden></button>
            <button id="center-btn" class="round-act" aria-label="Center"></button>
            <span id="act-caption" class="act-caption">Center</span>
          </div>
        </div>
        <div id="card-more" class="card-more">
          <div id="card-tools" class="card-tools"></div>
          <div id="card-graph" class="card-graph"></div>
          <div id="card-facts" class="facts"></div>
          <div id="card-wiki" class="wiki"></div>
        </div>
      </section>
    </div>

    <!-- Time sheet -->
    <section id="time-sheet" class="sheet panel" hidden>
      <div class="handle"></div>
      <div class="dt">
        <div class="dt-field" data-unit="year"><button class="up"></button><span></span><button class="down"></button></div>
        <span class="sep">/</span>
        <div class="dt-field" data-unit="month"><button class="up"></button><span></span><button class="down"></button></div>
        <span class="sep">/</span>
        <div class="dt-field" data-unit="day"><button class="up"></button><span></span><button class="down"></button></div>
        <span class="gap"></span>
        <div class="dt-field" data-unit="hour"><button class="up"></button><span></span><button class="down"></button></div>
        <span class="sep">:</span>
        <div class="dt-field" data-unit="minute"><button class="up"></button><span></span><button class="down"></button></div>
        <span class="sep">:</span>
        <div class="dt-field" data-unit="second"><button class="up"></button><span></span><button class="down"></button></div>
      </div>
      <div class="speed">
        <div id="speed-label" class="caption">Real time speed</div>
        <div class="speed-row">
          <button id="pause-btn" class="flat-icon" aria-label="Pause"></button>
          <input id="speed" type="range" min="-100" max="100" step="1" value="0" aria-label="Time speed" />
          <button id="speed-reset" class="flat-icon" aria-label="Real time speed"></button>
        </div>
      </div>
      <div class="divider"></div>
      <div class="jump">
        <button id="prev-night"><span class="ic"></span><span class="caption">Previous night</span></button>
        <button id="set-now"><span class="ic"></span><span class="caption">Set time to now</span></button>
        <button id="next-night"><span class="ic"></span><span class="caption">Next night</span></button>
      </div>
      <div class="daybar-wrap">
        <div id="daybar" class="daybar"><div id="daybar-thumb" class="thumb"></div></div>
        <div id="daybar-caption" class="caption center"></div>
      </div>
    </section>

    <!-- Layers sheet (root grid + sub-panels) -->
    <section id="layers-sheet" class="sheet panel layers" hidden>
      <div class="handle"></div>
      <div id="layers-root" class="layer-grid"></div>
      <div id="layers-sub" class="layer-sub" hidden>
        <div class="sub-head"><button id="sub-back" class="back-btn" aria-label="Back"></button><span id="sub-title"></span></div>
        <div id="sub-body" class="switches"></div>
      </div>
    </section>

    <!-- Search -->
    <section id="search" class="fullsheet" hidden>
      <div class="search-row">
        <div class="search-field"><span class="ic"></span><input id="search-input" type="search" placeholder="Search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" /></div>
        <button id="search-cancel" class="text-btn">Cancel</button>
      </div>
      <div id="search-chips" class="chips"></div>
      <ul id="search-results" class="results"></ul>
    </section>

    <!-- Menu drawer -->
    <div id="scrim" hidden></div>
    <nav id="drawer" aria-label="Menu">
      <div class="drawer-head"><div class="app-name">Star Map</div><div id="drawer-loc" class="caption"></div></div>
      <button class="drawer-item" data-open="tonight"><span class="ic" data-icon="mdiWeatherNight"></span>Tonight</button>
      <button class="drawer-item" data-open="calendar"><span class="ic" data-icon="mdiCalendarStar"></span>Calendar</button>
      <button class="drawer-item" data-open="instruments"><span class="ic" data-icon="mdiTelescope"></span>Instruments</button>
      <button class="drawer-item" data-open="location"><span class="ic" data-icon="mdiMapMarkerOutline"></span>Location</button>
      <button class="drawer-item" data-open="settings"><span class="ic" data-icon="mdiCogOutline"></span>Settings</button>
      <button class="drawer-item" data-open="about"><span class="ic" data-icon="mdiInformationOutline"></span>About</button>
    </nav>

    <section id="page" class="fullsheet" hidden>
      <div class="page-head"><button id="page-back" class="back-btn small" aria-label="Back"></button><span id="page-title"></span></div>
      <div id="page-body" class="page-body"></div>
    </section>

    <!-- 3D view of a planet, the Moon, the Sun, the ISS or Hubble. -->
    <section id="view3d" hidden>
      <div id="view3d-labels"></div>
      <div class="v3-bar"><button id="view3d-close" aria-label="Close 3D view"></button><span id="view3d-title"></span><button id="view3d-light" aria-label="Light the night side" aria-pressed="false"></button></div>
      <div id="view3d-status" class="caption"></div>
      <div class="v3-hint caption">Drag to turn · pinch to zoom</div>
    </section>

    <div id="toast" class="toast" role="status"></div>
    <div id="night-filter" aria-hidden="true"></div>

  </body>
</html>
