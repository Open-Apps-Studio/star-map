<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#05070d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Star Map</title>
    <script src="./engine/stellarium-web-engine.js"></script>
  </head>
  <body>
    <canvas id="stel-canvas"></canvas>

    <div id="loading">Loading the sky…</div>

    <header class="top">
      <button id="search-btn" class="glass search-pill" aria-label="Search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="M16 16l4.5 4.5" /></svg>
        <span>Search stars, planets…</span>
      </button>
      <button id="layers-btn" class="glass icon-btn" aria-label="Constellation art and lines">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17l5-9 6 4 5-8" /><circle cx="4" cy="17" r="1.6" /><circle cx="9" cy="8" r="1.6" /><circle cx="15" cy="12" r="1.6" /><circle cx="20" cy="4" r="1.6" /></svg>
      </button>
      <button id="night-btn" class="glass icon-btn" aria-label="Red night mode" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z" /></svg>
      </button>
    </header>

    <div id="guide" hidden>
      <div class="ring"></div>
      <div id="guide-arrow" class="arrow"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M30 20L12 9v22z" /></svg></div>
      <div id="guide-label" class="glass guide-label"></div>
    </div>

    <section id="card" class="glass card" aria-live="polite">
      <div class="card-head">
        <div>
          <div id="card-kind" class="card-kind"></div>
          <h2 id="card-name"></h2>
        </div>
        <button id="card-close" class="icon-btn plain" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>
      <div id="card-where" class="card-where"></div>
      <div id="card-facts" class="card-facts"></div>
      <p id="card-blurb" class="card-blurb"></p>
      <button id="card-find" class="primary small">Find it</button>
    </section>

    <footer class="bottom">
      <div id="tonight" class="tonight"></div>
      <div class="bar">
        <div id="scrub" class="glass scrub" aria-label="Drag to change time">
          <div class="ticks"></div>
          <div class="time">
            <span id="time-label"></span>
            <span id="time-delta" class="delta"></span>
          </div>
        </div>
        <button id="now-btn" class="glass now-btn">Now</button>
      </div>
      <button id="point-btn" class="primary point-btn" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.5" /><path d="M12 18.5h.01" /></svg>
        <span class="off">Point at the sky</span><span class="on">Phone mode on</span>
      </button>
    </footer>

    <div id="search-panel" class="search-panel" hidden>
      <div class="search-row">
        <input id="search-input" type="search" placeholder="Saturn, Orion, Andromeda…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" />
        <button id="search-cancel" class="plain">Cancel</button>
      </div>
      <ul id="search-results"></ul>
    </div>

    <div id="toast" class="glass toast" role="status"></div>
    <div id="night-filter" aria-hidden="true"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
